[project]
name = "uniflow"
version = "0.2.0"
description = "Telegram-помощник по учебным дедлайнам"
requires-python = ">=3.12,<3.15"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
